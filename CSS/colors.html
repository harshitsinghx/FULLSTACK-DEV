<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>colors</title>
    <style>
        h1{
            color:crimson;
        }
        .hex{
            color: #ff22ff;
        }
        .rgb{
            color: rgb(255, 33, 33);
        }
        .rgba{
            color: rgba(0, 13, 255, 0.407) ;
        }
        .hsl{
            color: hsl(236, 55%, 50%);
        }
    </style>
</head>
<body>
    <h1>Lets learn about colors</h1>
    <p>
        Color can be represented in:
        <ol>
            <li>Color Keywords</li>
            <li class="hex">Hex color code</li>
            <li class="rgb">RGB</li>
            <li class="rgba">RGBA</li>
            <li class="hsl">HSL -least preferable</li>
        </ol>
    </p>
</body>
</html>
