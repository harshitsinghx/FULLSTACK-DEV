<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        div>p:first-child{
            background-color: yellow;
            color: red;
            /* only first para is styled by this */
        }
        div>p:not(:first-child){
            background-color: blue;
            color: white;
        }

    </style>
</head>
<body>
    <div>
        <p>My name is Harshit Singh</p>
        <p>I am 20 years old</p>
        <p>I belong to Agra</p>
        <p>Currently I'm prsuing my b.tech degree</p>
        <p>I learning CSS and HTML</p>
    </div>
    <div>
        <p>My name is Harshit Singh</p>
        <p>I am 20 years old</p>
        <p>I belong to Agra</p>
        <p>Currently I'm prsuing my b.tech degree</p>
        <p>I am another para</p>
    </div>
</body>
</html>
